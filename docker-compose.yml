services:
  backend_panel:
    # Image committed with nodejs + pm2 + PATH-safe pm2 wrapper
    image: backend-backend_panel:withpm2
    build: .
    container_name: panel_backend_container
    # Host networking so the API can reach MySQL/PM2 daemon/Docker socket on the VPS.
    network_mode: "host"
    restart: always
    env_file:
      - .env
    environment:
      # Host PM2 runs as user lpmobe — must match mounted PM2_HOME
      - PM2_HOME=/home/lpmobe/.pm2
      - PM2_BIN=/usr/local/bin/pm2
      - PATH=/usr/local/bin:/usr/bin:/bin
      - HOME=/root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Docker: list/start/stop containers
      - /var/run/docker.sock:/var/run/docker.sock
      # PM2 host daemon (user lpmobe) — sockets + dump/logs
      - /home/lpmobe/.pm2:/home/lpmobe/.pm2
      # Host app sources for file manager / terminal
      - /var/www:/var/www
      - /home/lpmobe:/home/lpmobe
